[project]
name = "ancient-greek-reader-backend"
version = "0.1.0"
description = "OCR, Classical Attic G2P, and TTS API for Ancient Greek reading"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pillow>=10.0",
  "pydantic>=2.7",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
mms = [
  "torch>=2.2",
  "transformers>=4.45,<5",
  "accelerate>=0.34",
  "safetensors>=0.4",
  "numpy>=1.26",
]
kokoro = [
  "kokoro>=0.9.4",
  "soundfile>=0.12",
  "numpy>=1.26",
]
all = [
  "kokoro>=0.9.4",
  "soundfile>=0.12",
  "torch>=2.2",
  "transformers>=4.45,<5",
  "accelerate>=0.34",
  "safetensors>=0.4",
  "numpy>=1.26",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
