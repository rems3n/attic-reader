name: Verify app
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      E2E_FRONT: http://localhost:3000
      E2E_API: http://localhost:8000
      E2E_SHOTS: ${{ github.workspace }}/docs/screenshots/f1
      NAV_SHOTS: ${{ github.workspace }}/docs/screenshots/f1/navigation
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          pip install -e './backend[dev]' 'playwright==1.51.0'
          playwright install --with-deps chromium
          npm ci --prefix frontend
      - name: Unit tests and course validation
        working-directory: backend
        run: |
          python -m pytest -q
          python scripts/build_course.py --stats
      - name: Frontend tests and production build
        working-directory: frontend
        run: |
          npx tsc --noEmit -p .
          npx vitest run
          npm run build
      - name: Start test services
        id: services
        run: |
          mkdir -p "$E2E_SHOTS"
          python backend/scripts/e2e/fake_server.py > /tmp/api.log 2>&1 &
          npm --prefix frontend start -- --hostname 127.0.0.1 > /tmp/web.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for url in ['http://localhost:8000/health','http://localhost:3000/']:
              for attempt in range(90):
                  try:
                      urllib.request.urlopen(url, timeout=2)
                      break
                  except Exception:
                      time.sleep(1)
              else:
                  raise RuntimeError(f'{url} did not start')
          PY
      - name: Browser — shell
        if: ${{ !cancelled() && steps.services.outcome == 'success' }}
        working-directory: backend
        timeout-minutes: 6
        run: python scripts/e2e/e2e_shell.py 2>&1 | tee "$E2E_SHOTS/shell.log"
      - name: Browser — course
        if: ${{ !cancelled() && steps.services.outcome == 'success' }}
        working-directory: backend
        timeout-minutes: 6
        run: python scripts/e2e/e2e_course.py 2>&1 | tee "$E2E_SHOTS/course.log"
      - name: Browser — placement
        if: ${{ !cancelled() && steps.services.outcome == 'success' }}
        working-directory: backend
        timeout-minutes: 6
        run: python scripts/e2e/e2e_placement.py 2>&1 | tee "$E2E_SHOTS/placement.log"
      - name: Browser — stage1
        if: ${{ !cancelled() && steps.services.outcome == 'success' }}
        working-directory: backend
        timeout-minutes: 6
        run: python scripts/e2e/e2e_stage1.py 2>&1 | tee "$E2E_SHOTS/stage1.log"
      - name: Browser — stage2
        if: ${{ !cancelled() && steps.services.outcome == 'success' }}
        working-directory: backend
        timeout-minutes: 6
        run: python scripts/e2e/e2e_stage2.py 2>&1 | tee "$E2E_SHOTS/stage2.log"
      - name: Browser — tracks
        if: ${{ !cancelled() && steps.services.outcome == 'success' }}
        working-directory: backend
        timeout-minutes: 6
        run: python scripts/e2e/e2e_tracks.py 2>&1 | tee "$E2E_SHOTS/tracks.log"
      - name: Browser — skills
        if: ${{ !cancelled() && steps.services.outcome == 'success' }}
        working-directory: backend
        timeout-minutes: 6
        run: python scripts/e2e/e2e_skills.py 2>&1 | tee "$E2E_SHOTS/skills.log"
      - name: Browser — nav
        if: ${{ !cancelled() && steps.services.outcome == 'success' }}
        working-directory: backend
        timeout-minutes: 10
        run: python scripts/e2e/e2e_nav.py 2>&1 | tee "$E2E_SHOTS/nav.log"
      - name: Browser — offline
        if: ${{ !cancelled() && steps.services.outcome == 'success' }}
        working-directory: backend
        timeout-minutes: 10
        run: python scripts/e2e/e2e_offline.py 2>&1 | tee "$E2E_SHOTS/offline.log"
      - name: Save screenshots and browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-verification
          path: docs/screenshots/f1
          retention-days: 14

      - name: Save shell screenshots separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-screenshots
          path: |
            docs/screenshots/f1/phone-*.png
            docs/screenshots/f1/desktop-*.png
            docs/screenshots/f1/*.log
          retention-days: 14
