name: Import reviewed illustrations
on:
  push:
    branches: [feat/original-course-illustrations]
    paths: [.github/illustration-import.patch, .github/workflows/import-illustrations.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/feat/original-course-illustrations'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply reviewed metadata and code
        run: git apply --index .github/illustration-import.patch
      - name: Verify images and refresh inventory
        run: |
          python -m pip install -e './backend[dev]'
          python -m pytest backend/tests/test_build_images.py -q
          python backend/scripts/build_images.py inventory
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root = Path('backend/app/course_data/images')
          opening = json.loads((root / 'manifest.json').read_text())['images']
          assert not any(i['license'] == 'placeholder' for i in opening)
          for manifest in root.glob('manifest*.json'):
              for record in json.loads(manifest.read_text())['images']:
                  if record.get('file') and record['license'] != 'placeholder':
                      with Image.open(Path('frontend/public') / record['file']) as image:
                          image.verify()
          PY
      - name: Save verified import and remove temporary transport files
        run: |
          git rm .github/illustration-import.patch .github/workflows/import-illustrations.yml
          git add backend frontend docs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete opening lesson imagery with reviewed illustrations and cultural photographs'
          git push origin HEAD:feat/original-course-illustrations
